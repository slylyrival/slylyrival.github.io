<div class="controls">
  <div class="slider-control">
    <label for="elo">Δ (Elo difference)</label>
    <input
        type="range"
        id="elo"
        min="-400"
        max="400"
        step="10"
        value="0"
        >
        <output id="elo-value">0</output>
  </div>

  <div class="slider-control">
    <label for="mu">μ (Baseline goals)</label>

    <input
        type="range"
        id="mu"
        min="1"
        max="3"
        step="0.05"
        value="1.35"
        >
        <output id="mu-value">1.35</output>
  </div>

  <div class="slider-control">
    <label for="K">K (Elo sensitivity)</label>

    <input
        type="range"
        id="K"
        min="0"
        max="1"
        step="0.1"
        value="0.5"
        >
        <output id="K-value">0.5</output>
  </div>
  <button id="reset-button" type="button">Reset parameters</button>
</div>
